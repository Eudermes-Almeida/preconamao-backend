quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:preconamao123}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://127.0.0.1:5434/preconamao}
# O Session pooler do Supabase (plano grátis) aceita poucas conexões simultâneas; o padrão do Quarkus (20) é alto demais.
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX:10}

# Em produção definir SCHEMA_MANAGEMENT=none: o schema vem dos scripts numerados do repo preconamao-modelagem.
quarkus.hibernate-orm.schema-management.strategy=${SCHEMA_MANAGEMENT:update}
quarkus.hibernate-orm.log.sql=true

# Etiqueta da balança (produtos pesáveis): posições dentro do EAN-13, a partir de 0. Padrão =
# Supermercados ABC: 2 CCCC 00 VVVVV D (ver EtiquetaBalanca.java). Outra rede = outras env vars.
etiqueta-balanca.prefixo=${ETIQUETA_BALANCA_PREFIXO:2}
etiqueta-balanca.codigo-inicio=${ETIQUETA_BALANCA_CODIGO_INICIO:1}
etiqueta-balanca.codigo-tamanho=${ETIQUETA_BALANCA_CODIGO_TAMANHO:4}
etiqueta-balanca.valor-inicio=${ETIQUETA_BALANCA_VALOR_INICIO:7}
etiqueta-balanca.valor-tamanho=${ETIQUETA_BALANCA_VALOR_TAMANHO:5}

# Carga automática do PRICETAB (agente da loja): fração dos produtos ativos que, se sumir do
# arquivo, retém a carga (arquivo cortado/vazio).
carga.limite-inativacao=${CARGA_LIMITE_INATIVACAO:0.20}
# Catálogo único por enquanto: o preço é "confiável" conforme o agente desta loja.
loja.id-padrao=${LOJA_ID_PADRAO:1}

# Alertas por e-mail (agente sem sinal, carga retida...). Sem ALERTA_EMAIL, só vão para o log.
# MAILER_MOCK=true (padrão) também só registra no log; para enviar de verdade: MAILER_MOCK=false e
# as variáveis SMTP (ex.: Gmail com senha de app: smtp.gmail.com, 587, STARTTLS).
alerta.email-destino=${ALERTA_EMAIL:}
quarkus.mailer.mock=${MAILER_MOCK:true}
quarkus.mailer.from=${MAILER_FROM:alertas@simplificacompras.com.br}
quarkus.mailer.host=${MAILER_HOST:smtp.gmail.com}
quarkus.mailer.port=${MAILER_PORT:587}
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.username=${MAILER_USERNAME:}
quarkus.mailer.password=${MAILER_PASSWORD:}

quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
# Lista separada por vírgula; em produção, a URL do front (ex.: https://preconamao.vercel.app).
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200}
