quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:preconamao123}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://127.0.0.1:5434/preconamao}
# O Session pooler do Supabase (plano grátis) aceita poucas conexões simultâneas; o padrão do Quarkus (20) é alto demais.
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX:10}

# Em produção definir SCHEMA_MANAGEMENT=none: o schema vem dos scripts numerados do repo preconamao-modelagem.
quarkus.hibernate-orm.schema-management.strategy=${SCHEMA_MANAGEMENT:update}
quarkus.hibernate-orm.log.sql=true

# Multi-loja (scripts/027): etiqueta da balança e limite de inativação são de cada LOJA (tabela
# loja). Consulta do app sem ?loja=: loja padrão em produção (app antigo em cache); no DES, erro.
loja.id-padrao=${LOJA_ID_PADRAO:1}
loja.exigir-na-consulta=${LOJA_EXIGIR_NA_CONSULTA:false}
%dev.loja.exigir-na-consulta=true

# Arquivos recebidos das lojas (PRICETAB / dados da API), compactados, fora do banco. No DES, a
# pasta do laboratório; em produção, futuramente o Storage privado do Supabase.
armazenamento.pasta=${ARMAZENAMENTO_PASTA:armazenamento}
%dev.armazenamento.pasta=../laboratorio/armazenamento

# Chave GERAL do relatório (quem opera o sistema: todas as lojas). SHA-256 da chave; vazio = sem
# chave geral. No DES a chave é "chave-geral-des".
relatorio.chave-geral-hash=${RELATORIO_CHAVE_GERAL_HASH:}
%dev.relatorio.chave-geral-hash=1730db6a0b3287bbeacb87aa9389d7c0f519fc8fdc685cd3019b961ea23fe12e

# Alertas por e-mail (agente sem sinal, carga retida...). Sem ALERTA_EMAIL, só vão para o log.
# MAILER_MOCK=true (padrão) também só registra no log; para enviar de verdade: MAILER_MOCK=false e
# as variáveis SMTP (ex.: Gmail com senha de app: smtp.gmail.com, 587, STARTTLS).
alerta.email-destino=${ALERTA_EMAIL:}
quarkus.mailer.mock=${MAILER_MOCK:true}
quarkus.mailer.from=${MAILER_FROM:alertas@simplificacompras.com.br}
quarkus.mailer.host=${MAILER_HOST:smtp.gmail.com}
quarkus.mailer.port=${MAILER_PORT:587}
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.username=${MAILER_USERNAME:}
quarkus.mailer.password=${MAILER_PASSWORD:}

quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
# Lista separada por vírgula; em produção, a URL do front (ex.: https://preconamao.vercel.app).
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200}
# Total de produtos achados na busca por voz (a lista volta limitada a 10; ver ProdutoResource).
quarkus.http.cors.exposed-headers=X-Total-Encontrados

# Avisos da "Família" no celular (Web Push). Par de chaves VAPID (base64url: pública = ponto EC
# P-256 sem compressão, 65 bytes; privada = 32 bytes). Sem as duas, os avisos ficam desligados e o
# app esconde o botão "Ativar avisos". Gerar uma vez por ambiente e NUNCA trocar à toa: trocar a
# chave invalida as inscrições de todos os celulares (cada um teria de ativar de novo).
push.vapid.chave-publica=${PUSH_VAPID_PUBLICA:}
push.vapid.chave-privada=${PUSH_VAPID_PRIVADA:}
# Contato do responsável pelo servidor, exigido pelos serviços de push (URL https ou mailto:).
push.vapid.assunto=${PUSH_VAPID_ASSUNTO:https://www.simplificacompras.app.br}

# Credenciais das APIs das lojas (multi-loja, regra 12b): cifradas com AES-256-GCM. A chave (32
# bytes em base64) vem SÓ da variável de ambiente CREDENCIAIS_CHAVE em produção. A do DES abaixo só
# serve para o laboratório (credencial da API simulada) e é diferente da de produção.
credenciais.chave=${CREDENCIAIS_CHAVE:}
%dev.credenciais.chave=v9CEc3rJXgJPbk38EAl8G88PZPM+jtkZzolKGzdKaeA=
